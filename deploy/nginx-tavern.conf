# AI Tavern Pro 前置站点（myiskg-edge 并入版 · 现行线上配置）
# 说明：本文件是「追加到 /home/ubuntu/myiskg-edge/edge-nginx.conf（末尾 http 大括号前）」的 server 块参考，
#       与线上实际内容一致（2026-10-15 起）。
# 有意与其它子域不同的一点：**不做 http→https 强跳**——server 级 if 301 会波及 ACME 挑战路径，
#       且 80 保持完整功能（白名单已含 http origin）。续期与 http 兜底因此天然安全。
# ⚠ inode 坑：该文件被容器以「单文件 bind mount」读入——用 cp/scp/sed -i 替换文件会换 inode，
#   容器仍读旧内容。编辑后执行 `sudo docker restart myiskg-edge` 使之生效。
server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name tavern.myiskg.com;

    ssl_certificate     /etc/letsencrypt/live/tavern.myiskg.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tavern.myiskg.com/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 页面：静态单文件产物（宿主 /var/www/myiskg/tavern/AI-Tavern.html，经 /var/www/myiskg 只读挂载入容器）
    root /var/www/myiskg/tavern;
    index AI-Tavern.html;

    location / {
        try_files $uri /AI-Tavern.html;
    }

    # 网关：反代到本机自托管网关（原样运行 worker/index.js；密钥在 /opt/ai-tavern/tavern.env）
    location /v1/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header CF-Connecting-IP $remote_addr;   # 限流按真实访客 IP
        proxy_buffering off;                              # SSE 流式必须关闭缓冲
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
