.btn--ghost:hover { background: rgba(58, 42, 32, .45); }

.chip--accent { border-color: var(--accent-deep); color: var(--accent-base); }
.chip--warn { border-color: var(--state-warn); color: var(--state-warn); background: var(--warn-soft); }
.chip--info { border-color: var(--state-info); color: var(--state-info); background: var(--info-soft); }
.chip--danger { border-color: var(--state-danger); color: var(--state-danger); background: var(--danger-soft); }
.chip--success { border-color: var(--state-success); color: var(--state-success); background: var(--success-soft); }
.bar { display: grid; gap: var(--sp-1); }
.bar__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--sp-2); }
.bar__track {
height: 6px;

border: 1px solid var(--line-hair);

}
.bar__fill {
height: 100%;

transition: width var(--dur-slow) var(--ease-panel);
}
.agent-card {
position: relative;

grid-template-rows: auto auto 1fr auto;
gap: var(--sp-3);

border: 1px solid var(--line-bronze);
background:

.agent-card:hover {

}
.agent-card:active { transform: translateY(-1px); }
.agent-card__portrait {
display: grid;

border: 1px solid var(--line-hair);
box-shadow: var(--bevel-in);

}
.agent-card__portrait svg { width: auto; height: 92px; display: block; }
.agent-card__name { font-family: var(--font-display); font-size: var(--fs-h1); color: var(--text-1); }
.agent-card__code { font-family: var(--font-mono); font-size: var(--fs-micro); letter-spacing: var(--ls-label); }

.agent-card__desc { font-size: var(--fs-body-sm); color: var(--text-2); line-height: 1.7; }
.agent-card__tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); }
.ring {

place-items: center;
width: 10px; height: 10px;
border-radius: var(--r-full);
border: 2px solid var(--accent-base);
box-shadow: 0 0 8px var(--accent-glow);
animation: ring-breathe var(--dur-breath) var(--ease-breath) infinite;
}
@keyframes ring-breathe {
0%, 100% { box-shadow: 0 0 6px var(--accent-glow); }
50%      { box-shadow: 0 0 14px var(--accent-glow); }
}
.ring--tired { border-color: var(--text-3); box-shadow: none; animation: none; }
.ring--energized { animation-duration: 1600ms; }
.bubble {
max-width: 68ch;
padding: var(--sp-3) var(--sp-4);
border-radius: var(--r-3);
border: 1px solid var(--line);
background: var(--bg-surface-2);
color: var(--text-2);
font-size: var(--fs-body);
line-height: var(--lh-body);
}
.bubble--user { background: var(--bg-surface-1); color: var(--text-1); }
.bubble--agent { background: var(--accent-soft); border-color: var(--accent-deep); }
.trace { display: grid; gap: 0; }
.trace-node {
display: grid;
grid-template-columns: 22px 1fr auto;
align-items: start;
gap: var(--sp-2);
padding: var(--sp-2) 0;
position: relative;
}
.trace-node::before {                       /* 轴向虚线 */
content: "";
position: absolute;
left: 10px; top: 26px; bottom: -6px;
width: 1px;
border-left: 1px dashed var(--line);
}
.trace-node:last-child::before { display: none; }
.trace-node__glyph {
position: relative;
z-index: 1;
display: grid;
place-items: center;
width: 22px; height: 22px;
border-radius: var(--r-2);
border: 1px solid var(--line-bronze);
background: var(--bg-surface-1);
font-family: var(--font-mono);
font-size: 11px;
line-height: 1;
color: var(--text-3);
}
.trace-node__label { color: var(--text-2); font-size: var(--fs-body-sm); }
.trace-node__why { color: var(--text-3); font-size: var(--fs-meta); }
.trace-node__ms { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--text-2); }
.trace-node[data-state="pending"] .trace-node__glyph  { border-style: dashed; }
.trace-node[data-state="active"] .trace-node__glyph {
border-color: var(--accent-base);
border-style: solid;
color: var(--accent-base);
animation: ring-breathe var(--dur-breath) var(--ease-breath) infinite;
}
.trace-node[data-state="active"] .trace-node__label { color: var(--accent-base); }
.trace-node[data-state="done"] .trace-node__glyph {
border-color: var(--state-success);
border-style: solid;
background: var(--success-soft);
color: var(--state-success);
}
.trace-node[data-state="skipped"] .trace-node__glyph {
border-color: var(--state-warn);
border-style: solid;
background: var(--warn-soft);
color: var(--state-warn);
}
.trace-node[data-state="skipped"] .trace-node__label { text-decoration: line-through; }
.trace-node[data-state="error"] .trace-node__glyph {
border-color: var(--state-danger);
border-style: solid;
background: var(--danger-soft);
color: var(--state-danger);
}
.empty {
display: grid;
place-items: center;
gap: var(--sp-2);
padding: var(--sp-6) var(--sp-4);
border: 1px dashed var(--line);
border-radius: var(--r-3);
color: var(--text-3);
text-align: center;
font-size: var(--fs-body-sm);

.pill {

.pill--mock { border-color: var(--state-info); color: var(--state-info); }
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {

}
.transcript { display: grid; gap: var(--sp-4); }
.transcript__starters { display: grid; gap: var(--sp-2); }
.transcript__starters .chip { cursor: pointer; }
.transcript__starters .chip:hover { border-color: var(--accent-deep); color: var(--accent-base); }
.transcript__starters .chip[disabled] {
color: var(--text-disabled); border-color: var(--line-hair);

}
.turn { display: flex; }
.turn--user { justify-content: flex-end; }
.turn--assistant { justify-content: flex-start; }
.bubble__text { margin: 0; white-space: pre-wrap; word-break: break-word; }

}
.caret {

@keyframes caret-blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }
.composer-note { margin-top: var(--sp-2); line-height: 1.7; }
.composer-note strong { color: var(--text-1); font-weight: var(--fw-emph); }
.trace-meta {

padding-bottom: var(--sp-3); margin-bottom: var(--sp-3);
border-bottom: 1px solid var(--line-hair);
}
.trace-node__more {
margin-left: var(--sp-2); padding: 0;
color: var(--text-3); font-family: var(--font-mono); font-size: var(--fs-micro);

.trace-node__more:hover { color: var(--accent-base); }
.trace-detail { grid-column: 2 / -1; margin-top: var(--sp-2); }
.json {

background: var(--bg-void); border: 1px solid var(--line-hair); border-radius: var(--r-2);

white-space: pre-wrap; word-break: break-word;
}
.trace-memory {

padding-top: var(--sp-3); margin-top: var(--sp-3);

.trace-memory__list { display: grid; gap: var(--sp-1); color: var(--text-2); }
.trace--legend { opacity: .85; }

.cardx--bad { border-left-color: var(--state-warn); }
.cardx__head {

padding-bottom: var(--sp-2);
margin-bottom: var(--sp-2);

}
.cardx__title { color: var(--text-1); font-weight: var(--fw-emph); font-size: var(--fs-body); }
.cardx__degraded { display: grid; gap: var(--sp-2); }
.cardx__notes { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-2); }
.cardx__line { margin-top: var(--sp-2); color: var(--text-2); }
.cardx__line .label { margin-right: var(--sp-2); }
.cardx__steps { display: grid; gap: var(--sp-2); }

.cardx__mark { font-family: var(--font-mono); color: var(--text-3); text-align: center; }
.cardx__mark--done { color: var(--state-success); }
.cardx__steptext { color: var(--text-1); }
.cardx__why { grid-column: 2 / -1; color: var(--text-3); font-size: var(--fs-meta); }
.cardx__first {

.cardx__first .label { display: block; margin-bottom: 2px; }

.cardx__point { display: grid; grid-template-columns: 1fr auto; gap: var(--sp-1) var(--sp-2); align-items: center; }

.cardx__list { display: grid; gap: var(--sp-1); color: var(--text-2); margin-top: var(--sp-1); }

.cardx__variants { display: grid; gap: var(--sp-2); }

.hud__brand { display: flex; align-items: baseline; gap: var(--sp-2); min-width: 0; }

if (/^(data:|blob:)/i.test(u)) return false;
if (/^file:/i.test(u)) return false;
if (u.indexOf(apiBase()) === 0) return false;
if (!location.host) return true;
return u.indexOf(location.origin) !== 0;
});
} catch (err) {
return null;
}
}
function selfTest() {
var T = global.Tavern;
var results = [];
var add = function (name, ok, note) { results.push({ name: name, ok: ok, note: note || '' }); };
var vueOk = typeof global.Vue === 'object' && typeof global.Vue.createApp === 'function';
add('R15 · Vue 可用', vueOk, vueOk ? 'Vue ' + (global.Vue.version || '?') : 'window.Vue 缺失');
add('R15 · window.Tavern 未被 Vue 覆盖', typeof T === 'object' && !!(T.Personas && T.EventBus && T.Store && T.UI),
'Vue 与 Tavern 命名空间互不干扰');
var needTop = ['Personas', 'MockScripts', 'EventBus', 'Provider', 'Store', 'Turn', 'Providers', 'UI'];
var needUI = ['Portrait', 'TraceLive', 'Transcript', 'ScreenEntry', 'ScreenWorld', 'ScreenRoom', 'ScreenMemoryBoard', 'ScreenGrowth', 'AppShell'];
var missing = [];
needTop.forEach(function (k) { if (!T[k]) missing.push(k); });
needUI.forEach(function (k) { if (!T.UI || !T.UI[k]) missing.push('UI.' + k); });
add('命名空间完整', missing.length === 0,
missing.length ? '缺失：' + missing.join(', ') : needTop.length + ' 个顶层导出 + ' + needUI.length + ' 个 UI 组件');
var evOk = T.EventBus.TRACE_EVENTS.length === 8 && T.EventBus.UI_EVENTS.length === 3;
var throwsOnUnknown = false;
try { T.EventBus.emit('trace:not-a-real-event', {}); } catch (e) { throwsOnUnknown = true; }
add('事件契约（8 trace + 3 ui）', evOk, '与 stage-0 §2.4 一致');
add('未知事件名被拒绝', throwsOnUnknown, 'append 新事件必须先改契约文档');
var S = T.Store;
var before = S.state.session.route;
var beforeAgent = S.state.ui.activeAgentId;
var routeOk = false;
try {
S.routeTo('memory'); routeOk = S.state.session.route === 'memory';
S.openAgent('oracle'); routeOk = routeOk && S.state.ui.activeAgentId === 'oracle';
} catch (e) { routeOk = false; }
S.state.session.route = before;
S.state.ui.activeAgentId = beforeAgent;
add('路由往返（memory / room）', routeOk, '状态已复原');
var P = T.Personas;
add('persona 冻结参数', P.AGENTS.length === 3 && P.FROZEN.MOODS.length === 7 &&
P.FROZEN.QUOTA.bartender === 45 && P.FROZEN.RETRIEVAL.threshold === 0.35,
'spec ' + P.SPEC_VERSION + ' · ' + P.AGENTS.map(function (a) { return a.id; }).join('/'));
var prov = T.Provider.current();
var phases = T.Provider.PHASES;
var unmapped = phases.filter(function (p) { return !T.Provider.PHASE_TRANSPORT[p]; });
add('Provider 已注册', !!prov, prov ? prov.id + ' · ' + prov.meta.label : '未注册');
add('阶段→冻结事件映射完整', unmapped.length === 0,
phases.length + ' 个阶段，未映射 ' + unmapped.length + ' 个');
add('Provider 身份可被 UI 展示', !!(prov && typeof prov.meta.isMock === 'boolean' && typeof prov.meta.label === 'string'),
prov ? (prov.id + ' · isMock=' + prov.meta.isMock) : '未注册');
var ext = externalRequests();
add('除网关外零外部请求', ext !== null && ext.length === 0,
ext === null ? '环境不支持 resource timing（未知）'
: (ext.length === 0 ? '实测 0 条意外跨源资源（网关端点已列入白名单）' : ext.join(' , ')));
var failed = results.filter(function (r) { return !r.ok; }).length;
return { ok: failed === 0, failed: failed, results: results };
}
function report(test) {
var head = test.ok
? '%c[Tavern 自检] 全部通过 ✅'
: '%c[Tavern 自检] ' + test.failed + ' 项未通过 ❌';
console.group(head, 'font-weight:bold');
test.results.forEach(function (r) {
console.log((r.ok ? '  ✓ ' : '  ✗ ') + r.name + (r.note ? '  — ' + r.note : ''));
});
console.log('  提示：控制台输入 Tavern.__selfTest() 可随时重跑。');
console.groupEnd();
}
function boot() {
if (typeof global.Vue === 'undefined' || !global.Vue.createApp) {
showFatal('未找到内联的 Vue（vendor 缺失）。请重新构建：node build.js --release');
return;
}
if (!global.Tavern || !global.Tavern.UI || !global.Tavern.UI.AppShell) {
showFatal('应用脚本未完整加载（Tavern.UI.AppShell 缺失）。');
return;
}
doc.documentElement.setAttribute('data-build', (global.__TAVERN_BUILD__ || {}).hash || 'dev');
var P = global.Tavern.Provider;
var Providers = global.Tavern.Providers || {};
return chooseProvider(Providers).then(function (chosen) {
try {
P.register(chosen.provider);
} catch (err) {
showFatal('Provider 注册失败：' + (err && err.message), err && err.stack);
return;
}
global.Tavern.Store.state.session.online = chosen.online;
global.Tavern.Store.state.session.endpoint = chosen.online ? apiBase() : null;
mountAndCheck();
});
}
function chooseProvider(Providers) {
var Mock = Providers.Mock;
if (!Mock) return Promise.reject(new Error('缺少 MockProvider'));
if (forcedMock() || !canReachGateway() || !Providers.Gateway) {
return Promise.resolve({ provider: Mock, online: false, reason: forcedMock() ? 'forced' : 'no-http-context' });
}
var base = apiBase();
var to = (global.AbortSignal && AbortSignal.timeout) ? AbortSignal.timeout(2500) : undefined;
return fetch(base + '/v1/health', { signal: to })
.then(function (r) { return r.ok ? r.json() : null; })
.then(function (j) {
if (j && j.ok) { Providers.Gateway.setEndpoint(base); return { provider: Providers.Gateway, online: true }; }
return { provider: Mock, online: false, reason: 'health-not-ok' };
})
.catch(function () { return { provider: Mock, online: false, reason: 'probe-failed' }; });
}
function mountAndCheck() {
try {
var app = global.Vue.createApp(global.Tavern.UI.AppShell);
app.mount('#app');
} catch (err) {
showFatal('挂载失败：' + (err && err.message), err && err.stack);
return;
}
doc.addEventListener('visibilitychange', function () {
doc.documentElement.classList.toggle('is-paused', doc.hidden);
});
global.addEventListener('error', function (e) {
showFatal('运行时错误：' + (e.message || '未知'), e.error && e.error.stack);
});
global.addEventListener('unhandledrejection', function (e) {
showFatal('未处理的异步错误', e.reason && (e.reason.stack || e.reason.message || e.reason));
});
var test = selfTest();
report(test);
try {
var ext = externalRequests();
var root = doc.documentElement;
root.setAttribute('data-app-mounted', 'true');
root.setAttribute('data-vue', String(global.Vue.version || '?'));
root.setAttribute('data-provider', global.Tavern.Provider.current().id);
root.setAttribute('data-provider-kind', global.Tavern.Provider.current().kind);
root.setAttribute('data-selftest', test.ok ? 'pass' : 'fail');
root.setAttribute('data-selftest-failed', String(test.failed));
root.setAttribute('data-external-requests', ext === null ? 'unknown' : String(ext.length));
root.setAttribute('data-selftest-detail', JSON.stringify(test.results.map(function (r) {
return (r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.note ? ' | ' + r.note : '');
})));
} catch (e) { /* 自检结论写不进去不应影响页面 */ }
global.Tavern.__selfTest = selfTest;
global.Tavern.__externalRequests = externalRequests;
global.Tavern.__build = global.__TAVERN_BUILD__ || null;
}
if (doc.readyState === 'loading') {
doc.addEventListener('DOMContentLoaded', boot);
} else {
boot();
}
})(window);
</script>
